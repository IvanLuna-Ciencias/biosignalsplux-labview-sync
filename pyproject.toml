[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosignalsplux-labview-sync"
version = "0.0.0"
description = "Synchronized acquisition of Biosignalsplux sEMG signals and LabVIEW joint trajectories."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Iván Alberto Luna Hernández" }
]
keywords = [
    "biosignalsplux",
    "labview",
    "semg",
    "synchronization",
    "biomedical-signals"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9"
]

gui = [
    "numpy>=1.24,<2.0",
    "PyQt5>=5.15,<6",
    "pyqtgraph>=0.13,<1"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
